name: "DevSecOps Landing Zone CI/CD"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-security:
    name: "Pre-Flight Linting & Shift-Left Security"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize & Validate
        run: |
          cd environments/dev
          terraform init -backend=false
          terraform validate

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.52.0"

      - name: Run Checkov SAST Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Run tfsec Security Analysis
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true

      - name: Detect Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
